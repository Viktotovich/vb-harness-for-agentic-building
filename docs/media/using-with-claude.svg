<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Using the harness from Claude</title>
  <desc id="desc">Claude writes the request, about 740 tokens. The harness and a local model plan, edit, check, fix and review on your machine, 93,400 tokens. Claude reads the status, the report and the diff, about 6,400 tokens. Measured on the cookbook's third run: about 7,200 tokens on Claude's side and 93,400 on the local model, about 13 times as many.</desc>
  <!-- SPDX-License-Identifier: Apache-2.0 -->
  <!-- Copyright 2026 V and Bruno LLC -->
  <style>
    .t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #fafafa; }
    .m { fill: #a3a3ad; }
    .s { font-size: 13px; }
    .xs { font-size: 12px; }
    .h { font-size: 15px; font-weight: 600; }
    .n { font-size: 22px; font-weight: 700; }
    .model { fill: #5809e0; }
    .claude { fill: #16161a; stroke: #ddcbff; stroke-width: 1.5; }
    .plain { fill: #16161a; stroke: #2b2b33; }
    .arrow { stroke: #a3a3ad; stroke-width: 1.5; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a3a3ad"/></marker>
  </defs>
  <rect width="960" height="430" rx="6" fill="#0b0b0d"/>
  <text class="t h" x="24" y="34">Using the harness from Claude</text>
  <text class="t s m" x="24" y="54">Claude decides and reviews; the token-heavy work in between runs on your machine.</text>

  <!-- Claude writes the request -->
  <rect class="claude" x="24" y="80" width="190" height="118" rx="4"/>
  <text class="t s" x="119" y="106" text-anchor="middle" font-weight="600">Claude</text>
  <text class="t s m" x="119" y="126" text-anchor="middle">writes the request</text>
  <text class="t n" x="119" y="164" text-anchor="middle" fill="#ddcbff">~740</text>
  <text class="t xs m" x="119" y="184" text-anchor="middle">tokens</text>
  <path class="arrow" d="M214 139 H252"/>

  <!-- the harness and the local model -->
  <rect class="model" x="254" y="80" width="452" height="118" rx="4"/>
  <text class="t s" x="480" y="106" text-anchor="middle" font-weight="600">vb-harness + a local model</text>
  <text class="t s" x="480" y="126" text-anchor="middle" fill="#ddcbff">plan · edit · your checks · fix · review, on your machine</text>
  <text class="t n" x="480" y="164" text-anchor="middle">93,400</text>
  <text class="t xs" x="480" y="184" text-anchor="middle" fill="#ddcbff">tokens: 77,000 in, 16,400 out</text>
  <path class="arrow" d="M706 139 H744"/>

  <!-- Claude reads back -->
  <rect class="claude" x="746" y="80" width="190" height="118" rx="4"/>
  <text class="t s" x="841" y="106" text-anchor="middle" font-weight="600">Claude</text>
  <text class="t s m" x="841" y="126" text-anchor="middle">reads status, report, diff</text>
  <text class="t n" x="841" y="164" text-anchor="middle" fill="#ddcbff">~6,400</text>
  <text class="t xs m" x="841" y="184" text-anchor="middle">tokens</text>

  <!-- the split, to scale -->
  <text class="t h" x="24" y="246">Where the tokens went</text>
  <text class="t s m" x="24" y="266">One landing page, eight tasks (the cookbook's third run), drawn to scale.</text>

  <text class="t s" x="24" y="303">Claude</text>
  <rect x="150" y="288" width="61" height="22" rx="3" fill="#ddcbff"/>
  <text class="t s" x="221" y="304">~7,200</text>

  <text class="t s" x="24" y="343">Local model</text>
  <rect x="150" y="328" width="786" height="22" rx="3" class="model"/>
  <text class="t s" x="924" y="344" text-anchor="end" font-weight="600">93,400 · about 13×</text>

  <text class="t xs m" x="24" y="392">Claude's side is the size of what it writes and reads, estimated at three bytes a token (which errs high), without its own</text>
  <text class="t xs m" x="24" y="410">system prompt and turns. Claude building the same page directly was not measured.</text>
</svg>
