<svg xmlns="http://www.w3.org/2000/svg" width="960" height="622" viewBox="0 0 960 622" role="img" aria-labelledby="title desc">
  <title id="title">Average tokens per task by language</title>
  <desc id="desc">Average GPT-4 tokens per Rosetta Code task, lower is better: Clojure 109, Julia 109, Ruby 116, Perl 119, Python 128, Haskell 132, F# 135, Lua 140, Scala 144, OCaml 153, PHP 164, JavaScript 181, Java 187, Rust 199, Go 207, C# 211, C++ 264, C 285. Ruby is third, close to Clojure and Julia, and uses about 36 percent fewer tokens than JavaScript.</desc>
