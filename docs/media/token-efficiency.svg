    .t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #fafafa; }
    .m { fill: #a3a3ad; }
    .s { font-size: 13px; }
    .x { font-size: 11px; }
    .h { font-size: 16px; font-weight: 600; }
    .grid { stroke: #2b2b33; stroke-width: 1; }
  </style>
