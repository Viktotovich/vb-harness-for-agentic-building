<html lang="en" data-mode="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VB Harness · pair this device</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/pair.js" defer></script>
</head>
<body>
  <main class="pair">
    <div class="card pair-card">
      <div class="brand"><span class="logo" aria-hidden="true">VB</span>Harness</div>
      <h1>Pair this device</h1>
      <p class="muted">Type the 6-digit code shown on the computer running the harness. It is in the banner at the top of the app there, and in the terminal that started it.</p>
      <form id="pair-form" class="field-row">
        <input id="code" class="input pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456" aria-label="Pairing code" required>
        <button class="btn primary" type="submit">Pair</button>
      </form>
      <p id="msg" class="help" aria-live="polite"></p>
      <p class="help">Only on a network you trust: traffic on this address is not encrypted.</p>
    </div>
  </main>
</body>
</html>
